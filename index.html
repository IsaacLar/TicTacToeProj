<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="styles.css">
        
        <title>Tic Tac Toe</title>
    </head>
    <body>
        <h1>Let's play Tic Tac Toe!</h1>

        <button onclick="assignValue('top_left')" id="top_left">        </button>
        <button onclick="assignValue('top_mid')" id="top_mid"> </button>
        <button onclick="assignValue('top_right')" id="top_right"> </button>
        <br>
        <button onclick="assignValue('mid_left')" id="mid_left"> </button>
        <button onclick="assignValue('mid_mid')" id="mid_mid"> </button>
        <button onclick="assignValue('mid_right')" id="mid_right"> </button>
        <br>
        <button onclick="assignValue('bottom_left')" id="bottom_left"> </button>
        <button onclick="assignValue('bottom_mid')" id="bottom_mid"> </button>
        <button onclick="assignValue('bottom_right')" id="bottom_right"> </button>

        <script src="script.js"></script>
    </body>
</html>
